name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (no model weights: tests never load sentence-transformers)
        run: pip install pytest ruff python-igraph leidenalg rank-bm25
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
