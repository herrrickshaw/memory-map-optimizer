name: tests
# The repo only had the gitleaks gate, so no pytest job and no coverage. This runs both test files
# (test_memory_map_optimizer.py at the root and tests/). sentence-transformers is NOT installed: the
# model-calling functions are exercised with in-test fakes, so no model download is needed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov python-igraph leidenalg rank-bm25
      - name: Run offline tests with coverage
        run: python -m pytest -q -p no:cacheprovider --cov --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
